name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The GPU tests run on lavapipe, Mesa's software Vulkan device; the
      # runner has no Vulkan driver of its own.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      # All members together, so Cargo verifies each against the others
      # before their new version is on crates.io.
      - run: cargo package --workspace --allow-dirty
      - run: cd data/amber && sha256sum -c CHECKSUMS.sha256

  consumers:
    # Ubuntu 26.04 (ubuntu-latest since 2026-10) ships a gromacs package with unmet dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - run: sudo apt-get update && sudo apt-get install -y gromacs
      - run: python -m pip install "openmm==8.5.*"
      - run: cargo run -- prepare tests/fixtures/dipeptide.pdb -o consumer-output --salt 0
      - name: Load Amber output with OpenMM 8.5
        run: python -c "from openmm.app import AmberPrmtopFile,AmberInpcrdFile,PME; p=AmberPrmtopFile('consumer-output/system.prmtop'); c=AmberInpcrdFile('consumer-output/system.inpcrd'); s=p.createSystem(nonbondedMethod=PME); assert s.getNumParticles()==len(c.positions)"
      - name: Preprocess portable GROMACS output
        run: gmx grompp -f tests/fixtures/grompp.mdp -c consumer-output/system.gro -p consumer-output/system.top -o consumer-output/system.tpr -maxwarn 1
