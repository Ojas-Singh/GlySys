[package]
name = "glysys"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["GlySys contributors"]
license.workspace = true
description = "Pure-Rust Amber/GLYCAM preparation of solvated glycan and glycoprotein systems"
repository = "https://github.com/Ojas-Singh/GlySys"
keywords = ["glycan", "glycoprotein", "amber", "glycam", "gromacs"]
categories = ["science", "command-line-utilities"]
include = [
    "/src/**",
    "/data/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "glysys"
path = "src/lib.rs"

[[bin]]
name = "glysysbuilder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
# Keep GlySys aligned with the checked-out crabWURCS workspace used by
# ReGlyco.  The 0.3.1 PDB parser contains the LINK/chain recognition fixes
# needed by automatic glycan discovery.
crabwurcs = { path = "../crabWURCS/crabwurcs", version = "0.3.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[workspace]
members = ["crates/glysys-energy", "crates/glysys-opt", "crates/glysys-gpu", "crates/glysys-dynamics", "crates/glysys-runtime", "crates/glysys-md"]
default-members = [".", "crates/glysys-energy", "crates/glysys-opt", "crates/glysys-runtime"]
resolver = "3"

[workspace.package]
license = "AGPL-3.0-only"
