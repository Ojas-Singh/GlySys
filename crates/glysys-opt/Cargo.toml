[package]
name = "glysys-opt"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "Deterministic generic optimization algorithms for GlySys applications"
repository = "https://github.com/Ojas-Singh/GlySys"

[dependencies]
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1.1"
