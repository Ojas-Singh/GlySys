[package]
name = "glysys-dynamics"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Checkpointed implicit-solvent molecular dynamics for GlySys"
[dependencies]
glysys = { path = "../.." }
glysys-energy = { path = "../glysys-energy" }
glysys-opt = { path = "../glysys-opt" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
