[package]
name = "glysys-energy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "Amber and GLYCAM molecular mechanics energies for GlySys"
repository = "https://github.com/Ojas-Singh/GlySys"

[dependencies]
glysys = { version = "0.1.0", path = "../.." }
pulp = "=0.22.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
