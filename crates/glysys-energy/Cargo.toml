[package]
name = "glysys-energy"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "Amber and GLYCAM molecular mechanics energies for GlySys"
repository = "https://github.com/Ojas-Singh/GlySys"

[dependencies]
glysys = { version = "0.1.2", path = "../.." }
# relaxed-simd off: pulp would compile relaxed-SIMD code into wasm modules (only used after an
# explicit runtime opt-in), and Safari rejects any module that contains it.
pulp = { version = "=0.22.3", default-features = false, features = ["std", "x86-v3"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
rustfft = "6"

[dev-dependencies]
serde_json = "1"
