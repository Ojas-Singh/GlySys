[package]
name = "glysys-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Optional WebGPU molecular-mechanics evaluator for GlySys"

[dependencies]
glysys = { path = "../.." }
glysys-energy = { path = "../glysys-energy" }
wgpu = { version = "26", default-features = false, features = ["std", "webgpu", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
futures-channel = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "26", default-features = false, features = ["vulkan"] }

[dev-dependencies]
glysys-dynamics = { path = "../glysys-dynamics" }
pollster = "0.4"
naga = { version = "26", features = ["wgsl-in"] }
